<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="12周跑步">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>12周跑步 · 今日课表</title>
<style>
:root{
  --bg:#faf9f5; --surface:#ffffff; --surface2:#f7f5f0; --surface3:#f1eee6;
  --ink:#141413; --ink2:#5d5b54; --ink3:#8a877d;
  --line:#e8e4d9; --line2:#f0eee6;
  --accent:#c96442; --accent-soft:#f6e9e2; --accent-ink:#a84f31;
  --ok:#2d7a5e; --ok-soft:#e3f1ea;
  --warn:#b87320; --warn-soft:#fdf3e4;
  --bad:#c43c3c; --bad-soft:#fbeaea;
  --E:#5c7a5e; --M:#6b7f9e; --T:#b87320; --GP:#c96442; --I:#7d6487; --REST:#a8a49a;
  --serif:"Times New Roman",Georgia,"Songti SC","Noto Serif CJK SC","SimSun","STSong",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.app{max-width:560px;margin:0 auto;padding:20px 18px 10px}
h1,h2,h3{margin:0;font-weight:600;font-family:var(--serif);letter-spacing:-.01em}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px;color:var(--ink3);line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;
  padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,20,19,.03)}
.card.tight{padding:14px 16px}
.row{display:flex;gap:10px;align-items:center}
.row input,.row textarea{flex:1 1 auto;min-width:0}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);
  border:1px solid var(--line2);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
.btn{white-space:nowrap;flex:0 0 auto;appearance:none;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 15px;
  font-size:14px;font-weight:500;font-family:var(--sans);cursor:pointer;transition:background .15s,border-color .15s}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kv{background:var(--surface2);border-radius:10px;padding:10px 11px}
.kv .k{font-size:11px;color:var(--ink3);letter-spacing:.02em}
.kv .v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
input[type=number],input[type=text],input[type=search],textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:var(--sans)}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:56px}
input::placeholder,textarea::placeholder{color:#b9b5a9}
label.f{display:block;font-size:11.5px;color:var(--ink3);margin:0 0 6px 1px;letter-spacing:.02em}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 2px 18px}
.top .d1{font-size:28px;font-weight:500;letter-spacing:-.02em;font-family:var(--serif)}
.top .d2{font-size:13px;color:var(--ink3);margin-top:3px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--surface);
  border:1px solid var(--line2);border-radius:18px;padding:20px 20px 18px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(20,20,19,.035)}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--zc,var(--REST))}
.hero .zt{font-size:11.5px;letter-spacing:.08em;color:var(--zc,var(--REST));font-weight:600}
.hero .t{font-size:23px;font-weight:500;margin:7px 0 4px;font-family:var(--serif);letter-spacing:-.02em}
.hero .m{color:var(--ink2);font-size:14px;line-height:1.6}
.hero .stats{margin-top:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.hero .stats .kv{background:var(--surface2)}
.badge{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:6px;
  background:var(--surface2);color:var(--ink2);letter-spacing:.01em}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}

/* list */
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.item:first-child{border-top:0}
.dot{width:7px;height:7px;border-radius:99px;flex:0 0 auto;background:var(--REST)}
.item .nm{font-weight:500}
.item .ds{font-size:12.5px;color:var(--ink3)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:3px;top:12px;bottom:12px;width:1.5px;background:var(--line);border-radius:2px}
.tl .n{position:relative;display:flex;gap:10px;padding:7px 0}
.tl .n:before{content:"";position:absolute;left:-26px;top:12px;width:9px;height:9px;border-radius:99px;
  background:var(--surface);border:2px solid var(--accent);box-sizing:border-box}
.tl .tm{flex:0 0 46px;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;color:var(--accent-ink)}
.tl .tx{flex:1;min-width:0;font-size:14px;color:var(--ink)}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(250,249,245,.92);backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;appearance:none;background:none;border:0;color:var(--ink3);
  padding:12px 4px 11px;font-size:11px;font-weight:500;font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:.02em}
.tabbar button .ic{font-size:16px;line-height:1;opacity:.85}
.tabbar button.on{color:var(--ink)}
.tabbar button.on .ic{color:var(--accent);opacity:1}

/* week */
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.wkhead .n{font-weight:500;font-size:17px;font-family:var(--serif)}
.wksum{font-size:12.5px;color:var(--ink3)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dbtn{background:var(--surface2);border:1px solid transparent;border-radius:11px;padding:10px 6px;
  text-align:center;cursor:pointer;color:var(--ink)}
.dbtn .w{font-size:11px;color:var(--ink3)}
.dbtn .v{font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.dbtn .z{width:100%;height:3px;border-radius:9px;margin-top:7px;background:var(--REST)}
.dbtn.off{opacity:.5}
.dbtn .done{font-size:10.5px;color:var(--ok)}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(20,20,19,.32);z-index:60;display:none;backdrop-filter:blur(2px)}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;
  background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);max-width:560px;margin:0 auto;
  box-shadow:0 -8px 40px rgba(20,20,19,.12)}
.sheet.on{transform:translateY(0)}
.sheet h3{font-size:19px;margin-bottom:3px;font-weight:500}
.handle{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
ul.tips{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px;line-height:1.7}
ul.tips li{margin:4px 0}
.hr{border:0;border-top:1px solid var(--line2);margin:16px 0}
.prog{height:6px;border-radius:9px;background:var(--surface3);overflow:hidden;margin:9px 0 5px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.advice{margin-top:12px;padding:12px 14px;border-radius:11px;font-size:13.5px;line-height:1.6;
  background:var(--surface2);border:1px solid var(--line2);color:var(--ink2)}
.advice.warn{background:var(--warn-soft);border-color:#f2e2c8;color:#7a4d16}
.advice.bad{background:var(--bad-soft);border-color:#f0d4d4;color:#8e2f2f}
.advice.ok{background:var(--ok-soft);border-color:#d3e8dd;color:#235f49}
.feel{display:flex;gap:6px;margin-top:9px}
.feel button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font-size:12.5px;font-weight:500;font-family:var(--sans)}
.feel button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hide{display:none!important}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink2);padding:9px 6px;border-radius:8px;
  font-size:13px;font-weight:500;font-family:var(--sans)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,19,.08)}
.zbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface3);border:1px solid var(--line2)}
.zbar i{display:block;height:100%}
footer.foot{text-align:center;padding:10px 0 22px;font-size:11.5px;color:#b0aca0}
</style>
</head>
<body>

<div class="mask" id="mask"></div>

const Store = (function(){
  let ok = false, why = '';
  try{
    const k = '__rk_probe__';
    localStorage.setItem(k, '1');
    ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    if(!ok) why = '不回声';
  }catch(e){ ok = false; why = (e && e.name) || '被拒绝'; }
  return {
    ok: ok,
    why: why,
    read: function(k){ if(!ok) return null; try{ return localStorage.getItem(k); }catch(e){ return null; } },
    write: function(k, t){ if(!ok) return false; try{ localStorage.setItem(k, t); return true; }catch(e){ return false; } },
    drop: function(k){ if(!ok) return false; try{ localStorage.removeItem(k); return true; }catch(e){ return false; } }
  };
})();

/* 必须深拷贝：Object.assign({}, DEF) 是浅拷贝，checks/daily 会共享同一个对象，
   于是"新档案"会继承旧档案的打卡记录 —— 这个 bug 是测试抓出来的。 */
function freshState(){
  const s = JSON.parse(JSON.stringify(DEF));
  /* 每份课表自带「这个人」的默认身体数据（meta.defaultProfile）。
     没有它的话，朋友档案会继承我的 167cm/50kg/静息 55，红黄绿灯和负荷全是错的。 */
  const dp = (PLAN && PLAN.meta && PLAN.meta.defaultProfile) || null;
  if(dp){
    s.profile = Object.assign({}, s.profile, dp);
    if(dp.rhr) s.rhrBase = dp.rhr;
    if(dp.hrvBase) s.hrvBase = dp.hrvBase;
  }
  return s;
}
/* 结构归一：localStorage 被手改、导入别人编辑过的备份、老版本字段缺失时，
   Object.assign 会把 checks/daily 直接盖成 null，于是 render 里 S.checks[d.date] 抛错 →
   整页白屏且无法自愈。这里逐字段校验类型，不合法的一律退回默认值。 */
function normalizeState(o){
  const base = freshState();
  if(!o || typeof o !== 'object' || Array.isArray(o)) return base;
  const s = Object.assign(base, o);
  const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
  if(!isObj(s.checks)) s.checks = {};
  if(!isObj(s.daily)) s.daily = {};
  if(!isObj(s.seen)) s.seen = {};
  if(!Array.isArray(s.runs)) s.runs = [];
  s.profile = Object.assign(freshState().profile, isObj(s.profile) ? s.profile : {});
  if(typeof s.rhrBase !== 'number' || !(s.rhrBase > 30)) s.rhrBase = s.profile.rhr || 55;
  if(typeof s.hrvBase !== 'number' || !(s.hrvBase > 20)) s.hrvBase = 97;
  if(s.city != null && !isObj(s.city)) s.city = null;
  if(s.wxLast != null && !isObj(s.wxLast)) s.wxLast = null;
  if(isObj(s.wxLast) && !isObj(s.wxLast.w)) s.wxLast = null;
  if(s.startDate != null && !/^\d{4}-\d{2}-\d{2}$/.test(String(s.startDate))) s.startDate = null;
  if(s.tab != null && ['today','plan','data','log','set'].indexOf(s.tab) < 0) s.tab = 'today';
  return s;
}
function loadState(id){
  try{ return normalizeState(JSON.parse(Store.read(lsKey(id))||'{}')); }
  catch(e){ return freshState(); }
}
S = freshState();
function save(){
  if(!WHO){ saveErr = null; return false; }     // 还没选档案，不动任何人的数据
  if(!Store.ok){ saveErr = 'no-store'; return false; }
  try{ localStorage.setItem(lsKey(WHO), JSON.stringify(S)); saveErr = null; return true; }
  catch(e){
    saveErr = (e && (e.name==='QuotaExceededError' || e.code===22)) ? 'quota' : 'err';
    return false;
  }
}

/* 切换档案：换课表 + 换记录，两边互不覆盖 */
function applyPlan(id){
  PLAN = PLANS[id] || PLANS[PLAN_KEYS[0]];
  DAYS = PLAN.weeks.flatMap(w => w.days);
  rebuildZones();
}
function setWho(id){
  if(!PLANS[id]) return false;
  WHO = id;
  Store.write(LS_WHO, id);
  applyPlan(id);
  S = loadState(id);
  return true;
}
function forgetWho(){
  WHO = null;
  Store.drop(LS_WHO);
  S = freshState();
}

/* 老版本只有一个课表，键名 runkit.v1；朋友那份早先的独立文件用 runkit.friend.v1。
   第一次跑新版本时都搬进对应档案，不让已经填过的数据作废。 */
function migrateLegacy(){
  if(!Store.ok) return false;
  let did = false;
  const me = Store.read(LS_LEGACY);
  if(me && !Store.read(lsKey('me'))){
    if(Store.write(lsKey('me'), me)){ Store.drop(LS_LEGACY); did = true; }
  }
  const fr = Store.read(LS_FRIEND_LEGACY);
  if(fr && !Store.read(lsKey('friend'))){
    if(Store.write(lsKey('friend'), fr)){ Store.drop(LS_FRIEND_LEGACY); did = true; }
  }
  return did;
}

/* ---------- 日期 ---------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function todayISO(){ return iso(new Date()); }
function addMin(hhmm, delta){
  const p = hhmm.split(':').map(Number); let m = p[0]*60+p[1]+delta;
  m = ((m % 1440) + 1440) % 1440;
  return pad(Math.floor(m/60))+':'+pad(m%60);
}
function dayByDate(s){ return DAYS.find(d => d.date === s); }
function diffDays(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function addDays(d, n){ const r = new Date(d.getTime()); r.setDate(r.getDate()+n); return r; }

/* ---------- 「我的第 1 天」偏移 ----------
   课表是周一对齐的（周一/三/五休息，周二四六日训练），所以整份课表只按【整周】平移，
   星期几永远不变 —— 周二还是周二的课，不会因为平移把休息日挪到训练日上。
   OFF = 我的第 1 天 − 课表第 1 天（天数，恒为 7 的倍数）。
   记录一律按【课表日期】存（d.date），平移不会让打卡错位。 */
let OFF = 0;
function recomputeOff(){
  const sd = (S && S.startDate) || null;
  OFF = sd ? diffDays(PLAN.meta.start, sd) : 0;
  if(!isFinite(OFF)) OFF = 0;
}
function udOf(planISO){ return OFF ? iso(addDays(parseISO(planISO), OFF)) : planISO; }
function pdOf(userISO){ return OFF ? iso(addDays(parseISO(userISO), -OFF)) : userISO; }
function udLabel(planISO){ const d = parseISO(udOf(planISO)); return (d.getMonth()+1)+'/'+d.getDate(); }

/* 把任意一天吸附成合法的「第 1 天」：周一直接用；落在训练日就顺延到下一个周一；
   落在周三/周五（休息日）就用当周周一 —— 等于"今天休息，下一个训练日正常开跑"。 */
function snapStart(dISO){
  const d = parseISO(dISO);
  if(isNaN(d.getTime())) return PLAN.meta.start;
  const idx = (d.getDay()+6)%7;               // 0=周一 … 6=周日
  if(idx === 0) return iso(d);
  const proxy = DAYS[idx];                    // 课表里同一星期的课，判断是训练还是休息
  const isTraining = !!(proxy && proxy.type && proxy.type !== 'rest');
  return isTraining ? iso(addDays(d, 7-idx)) : iso(addDays(d, -idx));
}

/* URL 预览：?date=2026-11-19 看某天（按【用户日期】解释），?tab=plan 直接进某页 */
const Q = new URLSearchParams(location.search);
const PREVIEW = Q.get('date');
function planToday(){
  if(PREVIEW){ const p = pdOf(PREVIEW); if(dayByDate(p)) return p; }
  return pdOf(todayISO());
}
function isPreview(){ return !!(PREVIEW && dayByDate(pdOf(PREVIEW)) && pdOf(PREVIEW) !== pdOf(todayISO())); }

/* ---------- 状态闸门 ---------- */
/* 阈值跟着个人静息心率基线走，不写死 58/60/65：
   基线 +3 绿灯、+5 黄灯、+10 红灯。我的基线 55 → 58/60/65（与旧行为一致）；
   朋友的基线 66 → 69/71/76（写死的话他每天都会是红灯）。 */
function verdict(){
  const t = todayISO();                       // 「今早状态」永远指真实的今天，不是预览日
  const m = S.daily[t] || {};
  const hrv = m.hrv, rhr = m.rhr;
  const base = S.hrvBase || 97;
  const rB = S.rhrBase || 55;
  const hasHrv = hrv != null && hrv !== '' && !isNaN(hrv);
  const hasRhr = rhr != null && rhr !== '' && !isNaN(rhr) && rhr > 0;
  /* 按压痛排第一：没戴 HRV 设备的人勾了按压痛，也必须立刻看到红灯。 */
  if(m.pain) return {k:'red', label:'红灯 · 停跑 48 小时', cls:'bad',
    tip:'出现膝盖/胫骨/跟腱按压痛 → 零跑步、零力量，休息 48 小时后再评估'};
  /* 只有两项【都空】才算未填写。只填静息心率也要能判灯 ——
     不戴 HRV 手表的人只量静息心率，静息 76 却显示"未填写"等于白填。 */
  if(!hasHrv && !hasRhr) return {k:null, label:'未填写', cls:'muted',
    tip:'填 HRV 或静息心率任意一项就能判断（两项都填更准）'};
  const r = hasHrv ? (hrv / base) : 1;
  if((hasHrv && r <= 0.804) || (hasRhr && rhr >= rB+10)) return {k:'red', label:'红灯 · 停跑 48 小时', cls:'bad',
    tip:hasHrv
      ? 'HRV 低于基线 1.5 个标准差，或静息心率比你的基线（'+rB+'）高 10 次以上 → 停跑休息 48 小时'
      : '静息心率 ' + rhr + ' 比你的基线（' + rB + '）高 10 次以上 → 停跑休息 48 小时'};
  if((hasHrv && r < 0.845) || (hasRhr && rhr >= rB+5)) return {k:'yellow', label:'黄灯 · 降级保护', cls:'warn',
    tip:'质量课降级为 E 区轻松跑（心率 ≤'+eMaxHr()+'），取消附加力量训练'};
  if(!hasRhr || rhr <= rB+3) return {k:'green', label:'绿灯 · 照常跑', cls:'ok', tip:'身体恢复良好，严格按今天的课表执行'};
  return {k:'yellow', label:'黄灯 · 留意静息心率', cls:'warn', tip:'静息心率比基线（'+rB+'）高 3 次以上，今晚压住强度、取消力量'};
}

/* ---------- 天气 ---------- */
function weatherAdvice(w, day){
  if(!w || !w.ok) return null;
  if(w.aqi!=null && w.aqi>120) return {cls:'bad', t:'空气指数 '+Math.round(w.aqi)+'（>120）：改室内力量或跳绳 5 分热身；仅鼻塞无发烧可慢跑 20–30 分钟'};
  if(w.pop!=null && w.pop>=60) return {cls:'warn', t:'降水概率 '+w.pop+'%：改室内力量课；严禁补跑叠加，直接忽略今天这一课'};
  if(w.code>=95) return {cls:'warn', t:'雷雨天气：改室内力量课，不要出门'};
  if(w.feels!=null && w.feels<=5) return {cls:'warn', t:'体感 '+Math.round(w.feels)+'°C 偏冷：提前 20 分盐水洗鼻，前 10 分钟压到 E 区上限（≤' + eMaxHr() + ' 次/分）'};
  if(w.feels!=null && w.feels>=28) return {cls:'warn', t:'体感 '+Math.round(w.feels)+'°C 偏热：以心率为锚，别看配速，必要时整体降 10 秒/km'};
  if(day && day.type==='rest') return {cls:'ok', t:'今天休息日，不用管天气'};
  return {cls:'ok', t:'天气条件正常，按课表出门'};
}
const WX_TTL = 30 * 60 * 1000;   // 天气缓存 30 分钟
const WX_TIMEOUT = 8000;         // 单次请求超时（毫秒）
const WX_TRIES = 2;              // 卡住的网络下重试一次常常就通了

/* 带超时的 JSON 请求。没有超时是本项目踩过的真实故障：
   网络偶尔整段卡死时 fetch 永远不会 settle，「取天气…」就一直转下去。 */
function fetchJSON(url, ms){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} }, ms);
  const opt = {cache:'no-store'};
  if(ctl) opt.signal = ctl.signal;
  return fetch(url, opt).then(function(r){
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }, function(e){ clearTimeout(timer); throw e; });
}
async function tryJSON(url, ms, tries){
  let last = null;
  for(let i = 0; i < tries; i++){
    try{ return await fetchJSON(url, ms); }
    catch(e){
      last = (e && e.name === 'AbortError') ? new Error('超时') : e;
      if(i < tries - 1) await new Promise(function(r){ setTimeout(r, 500); });
    }
  }
  let msg = (last && last.message) || '网络不可用';
  if(/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg = '网络连不上';
  throw new Error(msg);
}

/* 上次成功取到的天气（存在 S.wxLast 里，跨刷新保留） */
function wxLast(){
  const l = S.wxLast;
  if(!l || typeof l !== 'object' || !l.w || typeof l.w !== 'object' || !l.w.ok) return null;
  return l;
}
function clockOf(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

async function loadWeather(force){
  if(!S.city || S.city.lat==null) return {ok:false, err:'未设置城市'};
  const key = S.city.lat + ',' + S.city.lon;
  if(!force && cache.weather && cache.dayKey===key && Date.now()-cache.at < WX_TTL) return cache.weather;
  const ymd = iso(new Date());
  const base = 'latitude='+S.city.lat+'&longitude='+S.city.lon+'&timezone=Asia%2FShanghai';
  const u1 = 'https://api.open-meteo.com/v1/forecast?'+base+'&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&forecast_days=3';
  const u2 = 'https://air-quality-api.open-meteo.com/v1/air-quality?'+base+'&hourly=pm2_5,european_aqi&forecast_days=3';

  /* 天气是主角：单独取，失败就带着原因返回，不再被 AQI 连累 */
  let a = null, err = null;
  try{ a = await tryJSON(u1, WX_TIMEOUT, WX_TRIES); }
  catch(e){ err = e; }
  const fail = function(why){
    cache = { weather:null, at:0, dayKey:key, err:why };
    return {ok:false, err:why};
  };
  if(!a || !a.hourly || !a.hourly.time){
    return fail('取不到天气（' + ((err && err.message) || '没有数据') + '）');
  }
  const idx = a.hourly.time.indexOf(ymd + 'T19:00');
  if(idx < 0) return fail('天气数据里没有今晚 19:00');

  /* 空气质量是配角：取不到就留空，绝不影响天气卡 */
  let b = {};
  try{ b = await tryJSON(u2, WX_TIMEOUT, 1); }catch(e){ b = {}; }

  const ai = (b.hourly && b.hourly.time) ? b.hourly.time.indexOf(ymd+'T19:00') : -1;
  const w = {
    ok:true,
    temp:a.hourly.temperature_2m[idx], feels:a.hourly.apparent_temperature[idx],
    pop:a.hourly.precipitation_probability ? a.hourly.precipitation_probability[idx] : null,
    code:a.hourly.weather_code[idx],
    wind:a.hourly.wind_speed_10m ? a.hourly.wind_speed_10m[idx] : null,
    aqi:(ai>=0 && b.hourly && b.hourly.european_aqi) ? b.hourly.european_aqi[ai] : null,
    pm:(ai>=0 && b.hourly && b.hourly.pm2_5) ? b.hourly.pm2_5[ai] : null,
    at:Date.now()
  };
  cache = { weather:w, at:Date.now(), dayKey:key, err:null };
  S.wxLast = { key:key, at:Date.now(), w:w };   // 存下来：下次连不上也能显示旧数据
  save();
  return w;
}

/* ---------- 环境自检 ---------- */
function envInfo(){
  const proto = String(location.protocol||'').replace(':','');
  let standalone = false;
  try{ standalone = !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }catch(e){}
  return {
    proto: proto, isFile: proto==='file',
    host: location.host || '本地文件',
    store: Store.ok, storeWhy: Store.why,
    secure: window.isSecureContext !== false,
    standalone: standalone,
    canGeo: !!(typeof navigator !== 'undefined' && navigator.geolocation && window.isSecureContext !== false)
  };
}
function envAdvice(){
  const e = envInfo();
  if(e.store) return {cls:'ok', t:'存储正常：数据留在这台设备的这个浏览器里。换手机、清缓存前请先导出备份。'};
  if(e.isFile) return {cls:'bad', t:'你现在是直接双击打开本地 HTML 文件。浏览器不给 file:// 页面存储权限（或每次刷新重开一个新沙盒），所以填过的东西全没了。修法：用托管网址打开（收藏或加到主屏幕），而不是打开本地文件。'};
  return {cls:'bad', t:'当前浏览器不让网页存数据，最常见于微信/QQ 内置浏览器、APP 内的网页预览、无痕模式。修法：点右上角「⋯ / 在浏览器打开」，用 Chrome 或 Safari 打开同一个网址。'};
}

/* ---------- 存不住的警示条 ---------- */

  if(Store.ok && !saveErr) return '';
  const t = Store.ok
    ? (saveErr==='quota' ? '本机存储满了（可能导入的跑步记录太多）。新的改动存不进去，先导出备份、清一点旧记录。'
                         : '写入本机存储失败，改动可能没保存。')
    : '当前打开方式不允许网页保存数据 —— 关掉页面后，今天填的 HRV、打卡、城市都会丢。';

/* ---------- 城市：默认不用手输 ---------- */
const TZ_CITY = {
  'Asia/Shanghai':'上海','Asia/Chongqing':'重庆','Asia/Urumqi':'乌鲁木齐','Asia/Harbin':'哈尔滨',
  'Asia/Taipei':'台北','Asia/Hong_Kong':'香港','Asia/Macau':'澳门','Asia/Tokyo':'东京',
  'Asia/Seoul':'首尔','Asia/Singapore':'新加坡','Asia/Bangkok':'曼谷','Asia/Kuala_Lumpur':'吉隆坡',
  'Asia/Manila':'马尼拉','Asia/Jakarta':'雅加达','Asia/Dubai':'迪拜',
  'Europe/London':'伦敦','Europe/Paris':'巴黎','Europe/Berlin':'柏林','Europe/Madrid':'马德里',
  'America/New_York':'New York','America/Chicago':'Chicago','America/Denver':'Denver',
  'America/Los_Angeles':'Los Angeles','America/Toronto':'Toronto','America/Vancouver':'Vancouver',
  'Australia/Sydney':'悉尼','Australia/Melbourne':'墨尔本','Pacific/Auckland':'奥克兰'
};
function guessCityName(){
  try{
    const tz = String((Intl.DateTimeFormat().resolvedOptions()||{}).timeZone || '');
    if(TZ_CITY[tz]) return TZ_CITY[tz];
    const tail = tz.split('/').pop();
    return tail ? tail.replace(/_/g,' ') : '上海';
  }catch(e){ return '上海'; }
}
async function geocode(name){
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name='+encodeURIComponent(name));
  const j = await r.json();
  const it = (j.results||[])[0];
  return it ? {name:it.name, lat:it.latitude, lon:it.longitude} : null;
}
/* 首次打开按系统时区自动定城市：即使存储不可用，也不用每次重新打字 */
async function autoCity(){
  if(S.city && S.city.lat!=null) return false;
  try{
    const c = await geocode(guessCityName());
    if(!c) return false;
    S.city = c; save(); return true;
  }catch(e){ return false; }
}

      </div>`;
    }).join('')}
    <footer class="foot">数据仅存本机 · 非医疗建议</footer>`;
}

function render(){
  recomputeOff();
  const tb = document.getElementById('tabbar');
  if(tb && tb.classList) tb.classList.toggle('hide', !WHO);
  if(!WHO){ app.innerHTML = chooser(); window.scrollTo({top:0}); return; }
  const tab = S.tab || 'today';
  [...document.querySelectorAll('#tabbar button')].forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  let html;
  if(tab==='today') html = viewToday();
  else if(tab==='plan') html = viewPlan();
  else if(tab==='data') html = viewData();
  else if(tab==='log') html = viewLog();
  else html = viewSet();
  app.innerHTML = banner() + html;
  window.scrollTo({top:0});
}

function todayMeta(){
  const t = planToday();
  const st = PLAN.meta.start, en = PLAN.meta.end;
  return {t, before: t < st, after: t > en, toStart: diffDays(t, st)};
}

function viewToday(){
  const m = todayMeta();
  const d = parseISO(udOf(m.t));   // 大标题显示用户日期，不是课表日期
  const week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const head = `<div class="top">
      <div><div class="d1">${d.getMonth()+1} 月 ${d.getDate()} 日</div>
      <div class="d2">${week}${m.before ? ' · 距开跑还有 '+m.toStart+' 天' : (m.after ? ' · 计划已结束' : '')}</div></div>
      <div class="badge">${PLAN.meta.id.split('-').pop()}</div>
    </div>`;

  if(m.before){
    const d1 = DAYS[0];
    return head + `<div class="card tight" style="border-color:var(--accent-soft);background:var(--accent-soft)">
        <div class="row"><div class="sp" style="font-weight:700">${m.toStart === 1 ? '计划明天开始' : '距开跑还有 ' + m.toStart + ' 天'} · 先看一眼第 1 天</div></div>
        <div class="tiny" style="margin-top:4px">${udOf(PLAN.meta.start)} → ${udOf(PLAN.meta.end)} · 共 ${PLAN.weeks.length} 周 · ${PLAN.meta.totalKm} km</div>
      </div>` + dayCard(d1, {preview:true}) + weekCard(d1) + footNote();
  }
  if(m.after) return head + `<div class="card">计划已于 ${udOf(PLAN.meta.end)} 结束。去「记录」看完成情况，或在设置里把「我的第 1 天」往后挪。</div>` + footNote();

  const day = dayByDate(m.t);
  if(!day) return head + `<div class="card">今天（${m.t}）不在计划范围内。</div>` + footNote();
  const pv = isPreview() ? `<div class="card tight" style="border-color:var(--accent-soft)">
      <div class="row"><div class="sp" style="font-size:13.5px">正在预览 ${esc(udOf(m.t))}（W${day.week} ${esc(day.dowName)}）</div>
      <button class="btn sm" data-act="exitPreview">回到今天</button></div></div>` : '';
  const ob = (S.seen && S.seen.onboard) ? '' : `<div class="card">
      <div class="row" style="margin-bottom:5px"><b>第一次用？三件事</b><div class="sp"></div>
        <button class="btn sm" data-act="dismissOnboard">知道了</button></div>
      <ul class="tips" style="margin-top:2px">
        <li>每天只做一件事：「今天」说跑什么就做什么，跑完点一下打卡。</li>
        <li>数据只在你手机的这个浏览器里，别人看不到；换手机前先导出备份。</li>
        <li>想当成 App 用：设置 → 装成手机 App，按提示加到主屏幕。</li>
      </ul>
    </div>`;
  return head + pv + ob + gateCard(day) + weatherCard(day) + dayCard(day) + timelineCard(day) + checkinCard(day) + weekCard(day) + footNote();
}

function zoneColor(z){ return ZC[z] || 'var(--REST)'; }

function gateCard(){
  const v = verdict();
  const t = todayISO();          // 今早状态永远指真实的今天
  const m = S.daily[t] || {};
  const cls = v.k==='green' ? 'ok' : v.k==='yellow' ? 'warn' : v.k==='red' ? 'bad' : '';
  return `<div class="card">
    <div class="row" style="margin-bottom:9px"><b>今早状态</b><div class="sp"></div>
      <span class="badge ${cls}">${esc(v.label)}</span></div>
    <div class="grid2">
      <div><label class="f">HRV / rMSSD（ms）</label>
        <input type="number" inputmode="numeric" id="inHrv" value="${m.hrv!=null?m.hrv:''}" placeholder="${S.hrvBase}"></div>
      <div><label class="f">静息心率（次/分）</label>
        <input type="number" inputmode="numeric" id="inRhr" value="${m.rhr!=null?m.rhr:''}" placeholder="${S.rhrBase}"></div>
    </div>
    <div class="row" style="margin-top:9px;gap:6px">
      <button class="btn sm ghost ${m.pain?'on':''}" data-act="pain">胫骨/跟腱按压痛</button>
      <div class="sp"></div>
      <button class="btn sm" data-act="gate">保存</button>
    </div>
    <div class="tiny" style="margin-top:9px;line-height:1.5">${esc(v.tip)}</div>
  </div>`;
}

function wxCardBody(w, day, staleWhy){
  const a = weatherAdvice(w, day);
  const code = w.code>=95 ? '雷雨' : w.code>=80 ? '阵雨' : w.code>=61 ? '雨' : w.code>=45 ? '雾' : w.code>=3 ? '阴' : '晴';
  return `<div class="card">
    <div class="row"><b>今晚 19:00 · ${esc(S.city.name||'本地')}</b><div class="sp"></div>
      <button class="btn sm ghost" data-act="wx">刷新</button></div>
    <div class="wx">
      <div class="kv"><div class="k">天气</div><div class="v">${code}</div></div>
      <div class="kv"><div class="k">体感</div><div class="v">${w.feels==null?'—':Math.round(w.feels)+'°'}</div></div>
      <div class="kv"><div class="k">降水</div><div class="v">${w.pop==null?'—':w.pop+'%'}</div></div>
      <div class="kv"><div class="k">空气</div><div class="v">${w.aqi==null?'—':Math.round(w.aqi)}</div></div>
    </div>
    ${a?`<div class="advice ${a.cls}">${esc(a.t)}</div>`:''}
    ${staleWhy ? `<div class="tiny" style="margin-top:8px">⚠ ${esc(staleWhy)}，上面是 ${clockOf(w.at)} 取到的数据。不影响课表与打卡。</div>` : ''}
  </div>`;
}

function weatherCard(day){
  if(!S.weather) return '';
  if(!S.city) return `<div class="card tight"><div class="row"><div class="sp muted">想看天气就先设城市</div>
     <button class="btn sm" data-act="tab" data-tab="set">去设置</button></div></div>`;
  const w = cache.weather;
  if(w && w.ok) return wxCardBody(w, day, '');
  /* 取失败：能把上次成功的显示出来就显示，并说明为什么是旧的 */
  const why = (w && w.err) || cache.err || '还没取过';
  const last = wxLast();
  const key = S.city.lat + ',' + S.city.lon;
  if(last && last.key === key) return wxCardBody(last.w, day, why);
  return `<div class="card tight">
    <div class="row"><div class="sp muted tiny">${esc(why)}</div>
      <button class="btn sm" data-act="wx">重试</button></div>
    <div class="tiny" style="margin-top:6px">天气只作参考，课表与打卡完全不受影响。</div>
  </div>`;
}

function statBox(k,v){ return `<div class="kv"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

function dayCard(day, opt){
  const zc = zoneColor(day.zone);
  const v = verdict();
  const check = S.checks[day.date];
  const adjust = (v.k==='red') ? 'bad' : (v.k==='yellow' && (day.strength || day.type==='quality' || day.type==='test')) ? 'warn' : '';
  const st = !check ? ''
    : check.status==='done' ? '<span class="badge ok">已完成</span>'
    : check.status==='downgrade' ? '<span class="badge warn">降级完成</span>'
    : check.status==='skip' ? '<span class="badge">已跳过</span>'
    : check.status==='extra' ? '<span class="badge">额外</span>'
    : '<span class="badge ok">力量已勾</span>';
  const t = day.type;
  const zoneLabel = t==='rest' ? '休息日' : (ZNAME[day.zone]||'训练');
  return `<div class="hero" style="--zc:${zc}">
    <div class="row"><div class="zt">${esc(zoneLabel)}${day.test?' · 测验日':''}</div><div class="sp"></div>${st}</div>
    <div class="t">${esc(day.title)}</div>
    <div class="m">${esc(day.main)}</div>
    ${day.time?`<div class="tiny" style="margin-top:5px">${esc(day.time)}</div>`:''}
    ${day.type==='rest'
      ? `<div class="tiny" style="margin-top:10px">${esc((day.detail&&day.detail[0])||day.main)}</div>`
      : `<div class="stats">
          ${statBox('距离', f1(day.km)+' km')}
          ${statBox('时长', (day.mn||'—')+' 分')}
          ${statBox('心率', day.hr?day.hr+' 次/分':'不控')}
          ${statBox('配速', day.pace?day.pace+' /km':'—')}
        </div>`}
    ${adjust==='warn'?`<div class="advice warn" style="margin-top:11px">黄灯：今天降级为 E 区（≤${eMaxHr()} 次/分），取消力量训练</div>`:''}
    ${adjust==='bad'?`<div class="advice bad" style="margin-top:11px">红灯：立即停跑 48 小时（零跑步、零力量）</div>`:''}
    <div class="row" style="margin-top:12px;gap:7px">
      ${day.detail&&day.detail.length?`<button class="btn sm" data-act="day" data-date="${day.date}">详细安排</button>`:''}
      ${day.strength?`<button class="btn sm" data-act="str" data-m="${day.strength}">力量 ${day.strength} 动作</button>`:''}
      ${day.test?`<button class="btn sm" data-act="test" data-t="${day.test}">测验卡</button>`:''}
    </div>
  </div>`;
}

function timelineCard(day){
  if(day.type==='rest' && !day.time) return '';
  const st = day.time ? day.time.split('–')[0] : null;
  const items = [];
  if(day.type==='rest'){
    items.push(['20:00','泡沫轴轻滚 15 分钟 + 5 分钟腹式呼吸']);
    items.push(['20:20','睡觉准备 · 睡 ≥ 8 小时']);
  }else{
    if(st) items.push([addMin(st,-20),'等渗盐水洗鼻（出门前 20 分）']);
    if(st) items.push([st,'开跑 · 前 10 分钟压慢热身（心率 ≤' + eMaxHr() + ' 次/分）']);
    if(day.strength) items.push(['19:55','力量 '+day.strength+'（'+PLAN.strengths[day.strength].minutes+' 分钟）']);
    items.push(['20:20','必须结束全部训练']);
    items.push(['20:50','30 分内：补水 250ml + 碳水 30–40g + 蛋白 10–15g']);
  }
  return `<div class="card">
    <div class="row" style="margin-bottom:6px"><b>今日时间线</b><div class="sp"></div>
      <span class="tiny">红线：20:20 停训</span></div>
    <div class="tl">${items.map(i=>`<div class="n"><span class="tm">${i[0]}</span><span class="tx">${esc(i[1])}</span></div>`).join('')}</div>
  </div>`;
}

function checkinCard(day){
  const c = S.checks[day.date] || {};
  // 休息日不下发打卡指令：休息本身是训练内容，给三个按钮等于暗示「可以不休息」
  if(day.type==='rest'){
    if(c.status==='extra') return `<div class="card">
      <div class="row"><div class="sp"><b>今天休息</b>
        <div class="tiny">已记一次计划外活动 · 只进记录，不占计划里程</div></div></div>
      <div class="row" style="margin-top:10px"><div class="sp"></div>
        <button class="btn sm ghost" data-act="ck" data-s="cancel">撤销这条</button></div>
    </div>`;
    return `<div class="card">
      <div class="row"><b>今天休息</b><div class="sp"></div><span class="tiny">不需要打卡</span></div>
      <div style="margin-top:7px" class="tiny">休息日也是训练内容。${esc((day.red&&day.red[0])||'零跑步')}</div>
      <div class="row" style="margin-top:10px"><div class="sp"><span class="tiny">计划外跑了一次？</span></div>
        <button class="btn sm ghost" data-act="ck" data-s="extra">记一笔</button></div>
    </div>`;
  }
  const done = !!c.status;
  return `<div class="card">
    <div class="row" style="margin-bottom:9px"><b>${done?'已打卡':'跑完打个卡'}</b><div class="sp"></div>
      <span class="tiny">${done?'点一下改':'数据只存本机'}</span></div>
    <div class="seg" id="segStatus">
      <button data-act="ck" data-s="done" class="${c.status==='done'?'on':''}">完成</button>
      <button data-act="ck" data-s="downgrade" class="${c.status==='downgrade'?'on':''}">降级完成</button>
      <button data-act="ck" data-s="skip" class="${c.status==='skip'?'on':''}">跳过</button>
    </div>
    ${day.strength?`<div class="row" style="margin-top:10px;gap:8px">
      <button class="btn sm ${c.strength?'on':''}" data-act="strCheck" data-v="${c.strength?'0':'1'}">
        ${c.strength?'\u2713 力量 '+day.strength+' 已完成':'\u25a1 力量 '+day.strength+' 未完成 · 点此勾选'}</button>
      <div class="sp"></div>
      <span class="tiny">${PLAN.strengths[day.strength].minutes} 分钟</span>
    </div>`:''}
    ${done?`<div class="feel" id="segFeel">
      ${[1,2,3,4,5].map(i=>`<button data-act="feel" data-f="${i}" class="${c.feel===i?'on':''}">${['很轻松','轻松','正常','偏累','很累'][i-1]}</button>`).join('')}
    </div>
    <div style="margin-top:9px"><label class="f">备注（选填）</label>
      <textarea id="inNote" placeholder="例：后 2km 心率偏高，小腿有点紧">${esc(c.note||'')}</textarea></div>
    <div class="row" style="margin-top:8px"><div class="sp"></div><button class="btn sm" data-act="saveNote">保存备注</button></div>`:''}
  </div>`;
}

function weekCard(day){
  const w = PLAN.weeks[day.week-1];
  if(!w) return '';
  const days = w.days.filter(d => [1,3,5,6].includes(d.dow));
  return `<div class="card">
    <div class="row"><div><b>W${w.n} · ${esc(w.phase)}</b>
      <div class="tiny">${esc(w.label)}</div></div><div class="sp"></div>
      <div style="text-align:right"><b>${f1(w.km)} km</b><div class="tiny">${esc(w.change)}</div></div></div>
    <div class="days">
      ${days.map(d=>`<div class="dbtn ${d.type==='rest'?'off':''}" data-act="day" data-date="${d.date}">
        <div class="w">${d.dowName.slice(1)}</div>
        <div class="v">${d.km?f1(d.km):'休'}</div>
        <div class="z" style="background:${zoneColor(d.zone)}"></div>
      </div>`).join('')}
    </div>
  </div>`;
}

function footNote(){
  return `<footer class="foot">${esc(PLAN.meta.id)} · 数据仅存本机 · 非医疗建议</footer>`;
}

/* ---------- 12 周 ---------- */
function viewPlan(){
  const done = Object.values(S.checks).filter(c => c && c.status).length;
  const totalKm = PLAN.meta.totalKm;
  /* 只有「完成 / 降级完成」才算计划里程；仅勾了力量的记录不进里程 */
  const doneKm = DAYS.filter(d=>{ const c = S.checks[d.date]; return c && (c.status==='done' || c.status==='downgrade'); }).reduce((a,b)=>a+b.km,0);
  const pct = Math.min(100, doneKm/totalKm*100);
  return `<div class="top"><div><div class="d1">12 周课表</div>
      <div class="d2">${udOf(PLAN.meta.start)} → ${udOf(PLAN.meta.end)}${OFF ? ' · 已整体平移 ' + OFF + ' 天' : ''}</div></div></div>
    <div class="card tight">
      <div class="row"><div class="sp tiny">已完成 <b style="color:var(--ink)">${doneKm.toFixed(1)}</b> / ${totalKm} km · ${done} 次打卡</div>
        <div class="tiny">${pct.toFixed(0)}%</div></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
    </div>` + PLAN.weeks.map(w=>{
      const days = w.days.filter(d=>[1,3,5,6].includes(d.dow));
      return `<div class="card">
        <div class="wkhead"><div class="n">W${w.n}</div>
          <div><div style="font-size:13.5px;font-weight:600">${esc(w.phase)}</div>
          <div class="wksum">${esc(w.label)}</div></div>
          <div class="sp"></div>
          <div style="text-align:right"><b>${f1(w.km)}</b><div class="tiny">${esc(w.change)}</div></div></div>
        <div class="days">
          ${days.map(d=>{
            const c = S.checks[d.date];
            const mark = !c ? ''
              : c.status==='skip' ? '<div style="font-size:10.5px;color:var(--ink3)">跳过</div>'
              : (c.status==='done'||c.status==='downgrade'||c.status==='extra') ? '<div class="done">✓</div>'
              : '<div style="font-size:10.5px;color:var(--ink3)">力</div>';
            return `<div class="dbtn ${d.type==='rest'?'off':''}" data-act="day" data-date="${d.date}">
              <div class="w">${udLabel(d.date)}</div>
              <div class="v">${d.km?f1(d.km)+'k':'休'}</div>
              ${mark}
              <div class="z" style="background:${zoneColor(d.zone)}"></div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('') + `<div class="card tight tiny">跑量、配速、心率区间均来自 ${esc(PLAN.meta.id)}（${PLAN.meta.totalKm} km 已核验）。点任意一天看当天安排。</div>`;
}

/* ---------- 记录 ---------- */
function viewLog(){
  const rows = DAYS.filter(d => S.checks[d.date]).sort((a,b)=> a.date<b.date?1:-1);
  const doneKm = rows.filter(r=>{ const c = S.checks[r.date]; return c.status==='done' || c.status==='downgrade'; }).reduce((a,b)=>a+b.km,0);
  const nDone = rows.filter(r=>S.checks[r.date].status==='done').length;
  const nDown = rows.filter(r=>S.checks[r.date].status==='downgrade').length;
  const nSkip = rows.filter(r=>S.checks[r.date].status==='skip').length;
  return `<div class="top"><div><div class="d1">记录</div><div class="d2">共 ${rows.length} 条</div></div></div>
    <div class="card"><div class="grid4">
      ${statBox('完成', nDone)}${statBox('降级', nDown)}${statBox('跳过', nSkip)}${statBox('里程', doneKm.toFixed(1)+'k')}
    </div></div>
    ${rows.length? rows.map(d=>{
      const c = S.checks[d.date];
      const badge = c.status==='done'?'ok':c.status==='downgrade'?'warn':'';
      const label = c.status==='done'?'完成':c.status==='downgrade'?'降级完成'
        :c.status==='extra'?'额外':c.status==='skip'?'跳过':'仅力量';
      return `<div class="card tight" data-act="day" data-date="${d.date}">
        <div class="row"><div class="dot" style="background:${zoneColor(d.zone)}"></div>
          <div class="sp"><div class="nm">${esc(d.title)}</div>
          <div class="ds">W${d.week} · ${udLabel(d.date)} ${d.dowName}${d.km?' · '+f1(d.km)+' km':''}${d.strength?(c.strength?' · 力量'+d.strength+' ✓':' · 力量'+d.strength+' 未勾'):''}${c.feel?' · '+['很轻松','轻松','正常','偏累','很累'][c.feel-1]:''}</div></div>
          <span class="badge ${badge}">${label}</span></div>
        ${c.note?`<div class="tiny" style="margin-top:6px">${esc(c.note)}</div>`:''}
      </div>`;
    }).join('') : `<div class="card muted">还没有打卡记录。跑完在「今天」点一下完成就行。</div>`}
    <div class="card tight"><div class="row"><div class="sp tiny">换手机或清缓存前，先导出备份</div>
      <button class="btn sm" data-act="export">导出</button></div></div>`;
}

/* ---------- 设置 ---------- */
function estHrMax(age){ return Math.round(208 - 0.7 * (age || 22)); }

function viewSet(){
  const c = S.city || {};
  const prof = S.profile || {};
  const env = envInfo();
  const ea = envAdvice();
  return `<div class="top"><div><div class="d1">设置</div><div class="d2">数据只存在这台设备</div></div></div>
    <div class="card">
      <div class="row"><div class="sp"><b>档案</b>
        <div class="tiny">${esc(PLAN.meta.title || PLAN.meta.id)}</div></div>
        <button class="btn sm" data-act="switchWho">切换</button></div>
      <div class="tiny" style="margin-top:8px">两份课表的打卡、HRV、导入记录各存各的，切换不会互相覆盖；导出只导当前档案。</div>
    </div>
    <div class="card">
      <b>我的第 1 天</b>
      <div class="tiny" style="margin:4px 0 9px">课表按<b>整周</b>平移，星期几不变（周二还是周二的课）。选到训练日会自动顺延到下一个周一，避免一上手就跑质量课。</div>
      <div class="row"><input type="date" id="inStart" value="${esc(S.startDate || PLAN.meta.start)}">
        <button class="btn sm" data-act="saveStart">保存</button></div>
      <div class="tiny" style="margin-top:8px">计划区间：${udOf(PLAN.meta.start)} → ${udOf(PLAN.meta.end)}${OFF ? '（已平移 '+OFF+' 天）' : '（与原课表一致）'}</div>

/* ---------------- 数据：导入跑步记录 ---------------- */
/* 心率区间不再写死：从当前课表的 zones 表里解析，换档案自动跟着换。
   两份课表的区间确实不同（我方 E 135–150，朋友 E 132–146），写死就会误判。 */
const ZORDER = ['E','M','T','GP','I'];
const ZLABEL = {warm:'热身/恢复',E:'轻松跑 E',M:'有氧稳态 M',T:'阈值跑 T',GP:'比赛配速 GP',I:'间歇跑 I',over:'超上限'};
const ZHR = {};
const STAGE_PACE = {};
let HR_WARM_MAX = 134, HR_OVER_MIN = 191;
const ZHR_FALLBACK = {E:[135,150], M:[152,164], T:[166,176], GP:[174,182], I:[178,190]};

function parseHrRange(s){
  if(!s) return null;
  const m = String(s).match(/(\d{2,3})\s*[^\d]{1,4}\s*(\d{2,3})/);
  return m ? [parseInt(m[1],10), parseInt(m[2],10)] : null;
}
function parsePaceMid(s){        // "6:20–6:50" / "5:40" → 秒/公里（多段取均值）
  if(!s) return null;
  const m = String(s).match(/(\d{1,2}):(\d{2})/g);
  if(!m) return null;
  const secs = m.map(x => { const p = x.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); });
  return secs.reduce((a,b)=>a+b,0) / secs.length;
}

function rebuildZones(){
  ZORDER.forEach(k => { delete ZHR[k]; });
  const z = (PLAN && PLAN.zones) || {};
  ZORDER.forEach(k => { const r = parseHrRange((z[k]||{}).hr); if(r) ZHR[k] = r; });
  if(!Object.keys(ZHR).length) Object.assign(ZHR, ZHR_FALLBACK);
  const known = ZORDER.filter(k => ZHR[k]);
  HR_WARM_MAX  = Math.min.apply(null, known.map(k=>ZHR[k][0])) - 1;
  HR_OVER_MIN  = Math.max.apply(null, known.map(k=>ZHR[k][1])) + 1;

  /* 阶段配速也改成从课表自身的 pace 字段推（区间的中位数），不再写死一张表 */
  Object.keys(STAGE_PACE).forEach(k => { delete STAGE_PACE[k]; });
  const bucket = {};
  DAYS.forEach(d => {
    if(!d.zone || !ZHR[d.zone]) return;
    const mid = parsePaceMid(d.pace);
    if(!mid) return;
    const st = stageOfWeek(d.week);
    bucket[st] = bucket[st] || {};
    (bucket[st][d.zone] = bucket[st][d.zone] || []).push(mid);
  });
  Object.keys(bucket).forEach(st => {
    STAGE_PACE[st] = {};
    Object.keys(bucket[st]).forEach(zz => {
      const arr = bucket[st][zz].sort((a,b)=>a-b);
      STAGE_PACE[st][zz] = Math.round(arr[Math.floor(arr.length/2)]);
    });
  });
}

function nearestZone(hr){
  let best = 'E', bd = null;
  ZORDER.forEach(z => {
    if(!ZHR[z]) return;
    const lo = ZHR[z][0], hi = ZHR[z][1];
    const d = hr < lo ? lo - hr : (hr > hi ? hr - hi : 0);
    if(bd == null || d < bd){ bd = d; best = z; }
  });
  return best;
}
function zoneOf(hr, pace, planned, stage){
  if(hr==null || isNaN(hr)) return 'unknown';
  if(hr <= HR_WARM_MAX) return 'warm';
  if(hr >= HR_OVER_MIN) return 'over';
  const cands = ZORDER.filter(z => ZHR[z] && hr>=ZHR[z][0] && hr<=ZHR[z][1]);
  if(cands.length<=1) return cands[0] || nearestZone(hr);
  if(cands.includes(planned)) return planned;
  if(pace && stage){
    const p = STAGE_PACE[stage] || {};
    let best=null, bd=null;
    cands.forEach(z=>{ if(p[z]){ const d=Math.abs(pace-p[z]); if(bd==null||d<bd){best=z;bd=d;} } });
    if(best) return best;
  }
  return cands[cands.length-1];
}
function bandOf(hr){ return nearestZone(hr); }
function eMaxHr(){ return (ZHR.E && ZHR.E[1]) || 150; }
function stageOfWeek(w){
  const n = (PLAN && PLAN.weeks) ? PLAN.weeks.length : 12;
  const a = Math.round(n/3), b = Math.round(2*n/3);
  return w<=a ? 1 : (w<=b ? 2 : 3);
}
function fixCad(c){ return !c ? null : (c<120 ? c*2 : c); }
rebuildZones();

function textOf(el, names){
  for(const n of names){
    const list = el.getElementsByTagName('*');
    for(let i=0;i<list.length;i++){ if(list[i].localName===n && list[i].textContent.trim()) return list[i].textContent.trim(); }
  }
  return null;
}

async function readTextSmart(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){
    try{ return new TextDecoder('gb18030').decode(buf); }
    catch(e2){ return new TextDecoder('utf-8').decode(buf); }
  }
}
function laters(el, name){
  const out = [];
  const all = el.getElementsByTagName('*');
  for(let i=0;i<all.length;i++) if(all[i].localName===name) out.push(all[i]);
  return out;
}
function numOf(el, names){
  for(const n of names){
    const list = laters(el, n);
    if(list.length){ const v = parseFloat(list[0].textContent); if(!isNaN(v)) return v; }
  }
  return null;
}
function hav(lat1, lon1, lat2, lon2){
  const R=6371000, p1=lat1*Math.PI/180, p2=lat2*Math.PI/180;
  const dp=p2-p1, dl=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function trackDistance(samples, stepS){
  stepS = stepS || 3;
  const pts = samples.filter(s=>s.lat!=null && s.lon!=null);
  if(pts.length<2) return 0;
  let total=0, last=pts[0];
  for(let i=1;i<pts.length;i++){
    const p=pts[i], d=hav(last.lat,last.lon,p.lat,p.lon), dtt=p.t-last.t;
    if(dtt<=0 || (dtt>0 && d/dtt>12)){ last=p; continue; }
    if(p.t-last.t>=stepS){ total+=d; last=p; }
  }
  return total;
}

function parseTCX(doc){
  const acts = laters(doc, 'Activity');
  if(!acts.length) throw new Error('TCX 里没有 Activity 节点');
  const sport = acts[0].getAttribute('Sport') || 'Running';
  const samples=[], laps=[];
  for(const lap of laters(acts[0], 'Lap')){
    const dur = numOf(lap, ['TotalTimeSeconds']);
    const dist = numOf(lap, ['DistanceMeters']);
    if(dur || dist){
      const avgEl = laters(lap, 'AverageHeartRateBpm')[0];
      const maxEl = laters(lap, 'MaximumHeartRateBpm')[0];
      laps.push({dur:dur, dist:dist, hr: avgEl?numOf(avgEl,['Value']):null, maxhr: maxEl?numOf(maxEl,['Value']):null});
    }
    for(const tp of laters(lap, 'Trackpoint')){
      const tn = laters(tp, 'Time')[0];
      if(!tn) continue;
      const tt = Date.parse(tn.textContent)/1000;
      if(isNaN(tt)) continue;
      const hrEl = laters(tp,'HeartRateBpm')[0];
      const posEl = laters(tp,'Position')[0];
      samples.push({
        t: tt,
        hr: hrEl ? numOf(hrEl,['Value']) : null,
        dist: numOf(tp,['DistanceMeters']),
        spd: numOf(tp,['Speed']),
        cad: fixCad(numOf(tp,['Cadence','RunCadence'])),
        lat: posEl ? numOf(posEl,['LatitudeDegrees']) : null,
        lon: posEl ? numOf(posEl,['LongitudeDegrees']) : null
      });
    }
  }
  return buildRun(samples, laps, sport, 'tcx');
}

function parseGPX(doc){
  const pts = [];
  const all = doc.getElementsByTagName('*');
  for(let i=0;i<all.length;i++){
    const ln = all[i].localName;
    if(ln==='trkpt'||ln==='rtept'||ln==='wpt') pts.push(all[i]);
  }
  const samples=[];
  for(const p of pts){
    const tn = laters(p,'time')[0];
    if(!tn) continue;
    const tt = Date.parse(tn.textContent)/1000;
    if(isNaN(tt)) continue;
    samples.push({
      t: tt,
      hr: numOf(p,['hr','heartrate']),
      dist: null,
      spd: numOf(p,['speed']),
      cad: fixCad(numOf(p,['cad','cadence'])),
      lat: p.getAttribute('lat')!=null ? parseFloat(p.getAttribute('lat')) : null,
      lon: p.getAttribute('lon')!=null ? parseFloat(p.getAttribute('lon')) : null
    });
  }
  return buildRun(samples, [], 'Running', 'gpx');
}

const FIT_EPOCH = 631065600;   // 1989-12-31T00:00:00Z
const FIT_SIZE = {0:1,1:1,2:1,0x83:2,0x84:2,0x85:4,0x86:4,7:1,0x88:4,0x89:8,0x0A:1,0x8B:2,0x8C:4,0x0D:1,0x8E:8,0x8F:8,0x90:8};
function fitValue(dv, off, type, le){
  try{
    switch(type){
      case 0x83: return dv.getInt16(off, le);
      case 0x84: return dv.getUint16(off, le);
      case 0x85: return dv.getInt32(off, le);
      case 0x86: case 0x8C: case 0x90: return dv.getUint32(off, le);
      case 0x88: return dv.getFloat32(off, le);
      case 0x89: return dv.getFloat64(off, le);
      case 0x8E: return Number(dv.getBigInt64(off, le));
      case 0x8F: return Number(dv.getBigUint64(off, le));
      default: return dv.getUint8(off);
    }
  }catch(e){ return null; }
}

function parseFIT(buf){
  const dv = new DataView(buf);
  if(buf.byteLength < 14) throw new Error('FIT 文件太短');
  let magic=''; for(let i=8;i<12;i++) magic += String.fromCharCode(dv.getUint8(i));
  if(magic!=='.FIT') throw new Error('不是有效的 FIT 文件');
  const hdr = dv.getUint8(0);
  const dsize = dv.getUint32(4, true);
  let i = hdr;
  const endPos = hdr + dsize;
  const defs = {};
  const samples = [];
  let sess = null;
  while(i < endPos){
    const b = dv.getUint8(i);
    if(b & 0x80){                       // 压缩时间戳
      const local = (b>>5) & 0x03;
      i++;
      const def = defs[local];
      if(!def) break;
      const vals = readFields(dv, i, def, true);
      i = vals.next;
      samples.push(toSample(vals.map, true, null));
    } else if(b & 0x40){                // 定义消息
      const local = b & 0x0F;
      i += 2;                            // header + reserved
      const arch = dv.getUint8(i); i++;
      const le = arch === 0;
      const gnum = dv.getUint16(i, le); i += 2;
      const n = dv.getUint8(i); i++;
      const fields = [];
      for(let k=0;k<n;k++){
        fields.push({num: dv.getUint8(i), size: dv.getUint8(i+1), type: dv.getUint8(i+2)});
        i += 3;
      }
      if(b & 0x20){ const nd = dv.getUint8(i); i += 1 + nd*3; }
      defs[local] = {gnum:gnum, fields:fields, le:le};
    } else {                             // 数据消息
      const local = b & 0x0F;
      i++;
      const def = defs[local];
      if(!def) break;
      const vals = readFields(dv, i, def, false);
      i = vals.next;
      if(def.gnum===20){ samples.push(toSample(vals.map, false, null)); }
      else if(def.gnum===18){
        sess = {
          dur: vals.map[7]!=null ? vals.map[7]/1000 : null,
          dist: vals.map[9]!=null ? vals.map[9]/100 : null,
          hr: vals.map[16], maxhr: vals.map[17], cad: vals.map[18]
        };
      }
    }
  }
  const laps = sess ? [{dur:sess.dur, dist:sess.dist, hr:sess.hr, maxhr:sess.maxhr}] : [];
  return buildRun(samples, laps, 'Running', 'fit');
}
function readFields(dv, i, def, compressed){
  const map = {};
  for(const f of def.fields){
    map[f.num] = f.type===7 ? null : fitValue(dv, i, f.type, def.le);
    i += f.size;
  }
  return {map: map, next: i};
}
function toSample(m, compressed, _){
  const ts = m[253];
  if(ts==null) return null;
  return {
    t: FIT_EPOCH + ts,
    hr: m[3]!=null ? m[3] : null,
    dist: m[5]!=null ? m[5]/100 : null,
    spd: (m[73]!=null ? m[73]/1000 : (m[6]!=null ? m[6]/1000 : null)),
    cad: fixCad(m[4]),
    lat: m[0]!=null ? m[0]/11930465 : null,
    lon: m[1]!=null ? m[1]/11930465 : null
  };
}

function buildRun(samples, laps, sport, source){
  samples = samples.filter(Boolean).sort((a,b)=>a.t-b.t);
  laps = (laps||[]).filter(l=>l && (l.dur || l.dist));
  const lapDur = laps.reduce((a,b)=>a+(b.dur||0),0) || null;
  const lapDist = laps.reduce((a,b)=>a+(b.dist||0),0) || null;
  if(!samples.length){
    if(!laps.length) throw new Error('文件里既没有轨迹点也没有圈数据');
    return {id:'', date:'', time:'', week:null, planned:null, title:'未排课',
      dist: (lapDist||0)/1000, dur: Math.round(lapDur||0), pace:null,
      avgHr: laps[0].hr, maxHr: laps[0].maxhr, cad: null, zs:{}, estimated:true};
  }
  const t0 = samples[0].t, t1 = samples[samples.length-1].t;
  const dists = samples.map(s=>s.dist).filter(v=>v!=null);
  let distM = 0;
  if(dists.length>1 && dists[dists.length-1]>dists[0]) distM = dists[dists.length-1]-dists[0];
  else if(lapDist) distM = lapDist;
  let estimated = false;
  if(!distM){ distM = trackDistance(samples); estimated = distM>0; }
  const dur = lapDur || (t1-t0);
  const hrs = samples.map(s=>s.hr).filter(v=>v!=null);
  const cads = samples.map(s=>s.cad).filter(v=>v!=null);
  const start = new Date(t0*1000);
  const pad2 = n => (n<10?'0':'')+n;
  return {
    samples: samples,
    start: start,
    dur: Math.round(dur),
    elapsed: Math.round(t1-t0),
    dist: distM/1000,
    avgHr: hrs.length ? Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length) : null,
    maxHr: hrs.length ? Math.round(Math.max.apply(null,hrs)) : null,
    cad: cads.length ? Math.round(cads.reduce((a,b)=>a+b,0)/cads.length) : null,
    estimated: estimated,
    source: source, sport: sport
  };
}

async function parseRunFile(file){
  const name = (file.name||'').toLowerCase();
  let raw;
  if(name.endsWith('.fit')){
    raw = await file.arrayBuffer();
    var base = parseFIT(raw);
  } else {
    const text = await readTextSmart(file);
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) throw new Error('文件不是有效的 XML');
    var base = name.endsWith('.gpx') ? parseGPX(doc) : parseTCX(doc);
  }
  const samples = base.samples || [];
  if(base.samples) delete base.samples;

  const start = base.start || new Date();
  const pad2 = n => (n<10?'0':'')+n;
  const date = start.getFullYear()+'-'+pad2(start.getMonth()+1)+'-'+pad2(start.getDate());
  const hhmm = pad2(start.getHours())+':'+pad2(start.getMinutes());
  const day = dayByDate(pdOf(date));
  const wk = day ? day.week : null;
  const planned = day ? day.zone : null;
  const stage = wk ? stageOfWeek(wk) : 3;

  const zs = {};
  const hist = {};
  let lastKnown = null;
  for(let i=0;i<samples.length-1;i++){
    const a=samples[i], b=samples[i+1], dtt=b.t-a.t;
    if(dtt<=0 || dtt>60) continue;
    let pace=null;
    if(a.spd) pace = 1000/a.spd;
    else if(a.dist!=null && b.dist!=null && b.dist-a.dist>0.3) pace = dtt/((b.dist-a.dist)/1000);
    let z = zoneOf(a.hr, pace, planned, stage);
    if(z==='unknown'){ if(lastKnown==null) continue; z = lastKnown; } else lastKnown = z;
    zs[z] = (zs[z]||0) + dtt;
    if(a.hr){ const k = Math.round(a.hr); hist[k] = (hist[k]||0) + dtt; }
  }
  return {
    id: (file.name+'|'+date+'|'+Math.round(base.dist*1000)),
    date: date, time: hhmm, week: wk, planned: planned,
    title: day ? day.title : '未排课',
    dist: Math.round(base.dist*1000)/1000,
    dur: base.dur,
    pace: base.dist>0.05 ? Math.round(base.dur/base.dist) : null,
    avgHr: base.avgHr, maxHr: base.maxHr, cad: base.cad,
    estimated: !!base.estimated,
    source: base.source,
    hrHist: hist,
    trimp: calcTrimp(hist, S.profile),
    zs: zs
  };
}

function calcTrimp(hist, prof){
  if(!hist) return null;
  const p = prof || S.profile || {};
  const rhr = p.rhr || 55, hrmax = p.hrmax || 193;
  const a = (p.sex === 'female') ? 0.86 : 0.64;
  const b = (p.sex === 'female') ? 1.67 : 1.92;
  let sum = 0;
  Object.keys(hist).forEach(k => {
    const hr = parseInt(k, 10), sec = hist[k];
    if(!(hr >= 30 && hr <= 235)) return;
    let hrr = (hr - rhr) / Math.max(1, hrmax - rhr);
    hrr = Math.max(0, Math.min(1, hrr));
    sum += sec * a * Math.exp(b * hrr);
  });
  return Math.round(sum / 60);
}

function zTotals(runs){
  const tot = {};
  runs.forEach(r => Object.keys(r.zs||{}).forEach(z => { tot[z] = (tot[z]||0) + r.zs[z]; }));
  return tot;
}
function mins(s){ return Math.round((s||0)/60); }
function zoneBar(tot){
  const sum = Object.values(tot).reduce((a,b)=>a+b,0) || 1;
  const cols = {warm:'#a8a49a',E:'#5c7a5e',M:'#6b7f9e',T:'#b87320',GP:'#c96442',I:'#7d6487',over:'#c43c3c'};
  const segs = ['warm','E','M','T','GP','I','over'].filter(z=>tot[z]).map(z=>{
    const w=(tot[z]/sum*100);
    return '<i style="width:'+w.toFixed(1)+'%;background:'+cols[z]+'"></i>';
  }).join('');
  const legend = ['warm','E','M','T','GP','I','over'].filter(z=>tot[z]).map(z=>
    '<span class="tiny" style="margin-right:8px"><b style="color:'+cols[z]+'">■</b> '+ZLABEL[z]+' '+Math.round(tot[z]/sum*100)+'%</span>').join('');
  return '<div class="zbar">'+segs+'</div><div style="margin-top:6px;line-height:1.9">'+legend+'</div>';
}

function boundsOf(mode, dateStr){
  const d = parseISO(dateStr);
  if(mode==='month'){
    const y=d.getFullYear(), m=d.getMonth();
    return [iso(new Date(y,m,1)), iso(new Date(y,m+1,0))];
  }
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [iso(mon), iso(sun)];
}
function periodRuns(mode){
  const runs = (S.runs||[]).slice();
  let [from,to] = boundsOf(mode, todayISO());
  let list = runs.filter(r=>r.date>=from && r.date<=to);
  if(!list.length && runs.length){
    const latest = runs.slice().sort((a,b)=>a.date<b.date?1:-1)[0].date;
    [from,to] = boundsOf(mode, latest);
    list = runs.filter(r=>r.date>=from && r.date<=to);
  }
  return list.sort((a,b)=> a.date<b.date?1:-1), {list:list, from:from, to:to};
}

function viewData(){
  const runs = (S.runs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const mode = S.dataMode || 'week';
  const pr = periodRuns(mode);
  const list = pr.list;
  const tot = zTotals(list);
  const km = list.reduce((a,b)=>a+b.dist,0);
  const dur = list.reduce((a,b)=>a+b.dur,0);

  const head = `<div class="top"><div><div class="d1">跑步数据</div>
    <div class="d2">共 ${runs.length} 次 · 累计 ${runs.reduce((a,b)=>a+b.dist,0).toFixed(1)} km</div></div></div>`;

  const importer = `<div class="card">
    <div class="row"><div class="sp"><b>导入跑步记录</b>
      <div class="tiny" style="margin-top:3px">Zepp：运动记录 → 某次跑步 → 分享 → 导出 → TCX</div></div>
      <button class="btn sm primary" data-act="importRuns">选择文件</button></div>
    <div class="tiny" style="margin-top:8px">支持 .tcx / .gpx / .fit，可一次多选；按日期+距离自动去重</div>
    <input type="file" id="fileRuns" accept=".tcx,.gpx,.fit,.xml" multiple class="hide">
  </div>`;

  if(!runs.length){
    return head + importer + `<div class="card muted">还没有导入数据。跑完把 TCX 导出来丢进来，这里会按心率区间自动统计轻松跑/有氧/阈值/间歇各占多少。</div>`;
  }

  const seg = `<div class="seg" style="margin-bottom:12px">
      <button data-act="dataMode" data-m="week" class="${mode==='week'?'on':''}">本周</button>
      <button data-act="dataMode" data-m="month" class="${mode==='month'?'on':''}">本月</button>
    </div>`;

  const summary = `<div class="card">
    <div class="tiny" style="margin-bottom:8px">${mode==='month'?'本月':'本周'} · ${esc(pr.from)} ~ ${esc(pr.to)}</div>
    <div class="grid4">
      ${statBox('次数', list.length)}
      ${statBox('里程', km.toFixed(1)+' km')}
      ${statBox('时长', mins(dur)+' 分')}
      ${statBox('均步频', list.length? Math.round(list.filter(r=>r.cad).reduce((a,b)=>a+b.cad,0)/Math.max(1,list.filter(r=>r.cad).length)) : '—')}
    </div>
    <div class="grid2" style="margin-top:9px">
      ${statBox('训练负荷', (list.reduce((a,b)=>a+(b.trimp||0),0))+' TRIMP')}
      ${statBox('平均心率', list.length? Math.round(list.filter(r=>r.avgHr).reduce((a,b)=>a+b.avgHr,0)/Math.max(1,list.filter(r=>r.avgHr).length)) : '—')}
    </div>
    <div style="margin-top:12px">${zoneBar(tot)}</div>
  </div>`;

  const rows = list.map(r=>{
    const z = Object.keys(r.zs||{}).sort((a,b)=>r.zs[b]-r.zs[a])[0];
    const pct = z ? Math.round(r.zs[z]/(Object.values(r.zs).reduce((a,b)=>a+b,0)||1)*100) : 0;
    return `<div class="card tight" data-act="runDetail" data-id="${r.id}">
      <div class="row"><div class="dot" style="background:${ZC[r.planned]||'#64748b'}"></div>
        <div class="sp"><div class="nm">${esc(r.title)}</div>
        <div class="ds">${r.date} ${r.time} · ${r.dist.toFixed(2)} km · ${Math.round(r.dur/60)} 分 · ${r.pace?mmssJS(r.pace)+'/km':'—'}</div></div>
        <div style="text-align:right"><b style="font-size:13px">${r.avgHr||'—'}</b><div class="tiny">均心率</div></div>
      </div>
      <div class="tiny" style="margin-top:6px">主区间 ${z?ZLABEL[z]:'—'} ${pct}% · 步频 ${r.cad||'—'} · 最大心率 ${r.maxHr||'—'}</div>
    </div>`;
  }).join('');

  return head + importer + seg + summary + `<div style="margin:14px 2px 8px;font-weight:700">明细</div>` + rows +
    `<div class="card tight"><div class="row"><div class="sp tiny">导出给 AI 复盘用（Markdown）</div>
      <button class="btn sm" data-act="exportRuns">导出</button>
      <button class="btn sm ghost" data-act="clearRuns">清空</button></div></div>` + footNote();
}

function mmssJS(s){ s=Math.round(s); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

function exportRunsMd(){
  const runs = (S.runs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const byWeek = {};
  runs.forEach(r=>{ const k=r.week?('W'+r.week):'其他'; (byWeek[k]=byWeek[k]||[]).push(r); });
  const L = ['# 跑步数据导出（'+new Date().toISOString().slice(0,10)+'）',''];
  Object.keys(byWeek).sort().forEach(k=>{
    const rs = byWeek[k]; const tot = zTotals(rs);
    const sum = Object.values(tot).reduce((a,b)=>a+b,0)||1;
    L.push('## '+k+' · '+rs.length+' 次 · '+rs.reduce((a,b)=>a+b.dist,0).toFixed(2)+' km');
    L.push('');
    L.push('区间占比：' + ['warm','E','M','T','GP','I','over'].filter(z=>tot[z])
      .map(z=>ZLABEL[z]+' '+Math.round(tot[z]/sum*100)+'%').join(' ｜ '));
    L.push('');
    L.push('| 日期 | 时间 | 计划课 | 距离km | 时长 | 配速 | 均心率 | 最大 | 步频 |');
    L.push('|---|---|---|---|---|---|---|---|---|');
    rs.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{
      L.push('| '+[r.date,r.time,r.title,r.dist.toFixed(2),mmssJS(r.dur),r.pace?mmssJS(r.pace):'—',r.avgHr||'—',r.maxHr||'—',r.cad||'—'].join(' | ')+' |');
    });
    L.push('');
  });
  L.push('## 口径说明');
  L.push('- 区间按心率逐秒判定，按时间占比统计；区间重叠时优先采用当天计划课型');
  L.push('- ' + ZORDER.filter(z=>ZHR[z]).map(z => z+' '+ZHR[z][0]+'–'+ZHR[z][1]).join(' / ')
    + '，≤' + HR_WARM_MAX + ' 记热身，≥' + HR_OVER_MIN + ' 记超上限');
  return L.join('\n');
}

/* ---------- 交互 ---------- */
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-act]');
  const tabBtn = e.target.closest('#tabbar button');
  if(tabBtn){ S.tab = tabBtn.dataset.tab; save(); render(); if(S.tab==='today') maybeWeather(); return; }
  if(!btn) {
    if(e.target.id==='mask') closeSheet();
    return;
  }
  const act = btn.dataset.act;
  const t = planToday();

  if(act==='tab'){ S.tab = btn.dataset.tab; save(); render(); return; }
  if(act==='exitPreview'){ location.search = ''; return; }
  if(act==='pick'){
    const id = btn.dataset.id;
    if(!setWho(id)) return;
    if(!['today','plan','data','log','set'].includes(S.tab)) S.tab = 'today';
    render(); maybeWeather();
    if(!S.city || S.city.lat==null){
      autoCity().then(function(ch){ if(ch){ render(); maybeWeather(); } });
    }
    return;
  }
  if(act==='switchWho'){ forgetWho(); render(); return; }
  if(act==='saveStart'){
    const v = (document.getElementById('inStart').value || '').trim();
    if(!v) return;
    const snapped = snapStart(v);
    S.startDate = snapped;
    recomputeOff();
    save();
    if(snapped !== v){
      const msg = snapped > v
        ? '「' + v + '」是训练日，已顺延到下一个周一：' + snapped + '\n\n这样你有完整的一周，不会一上手就被推上质量课。'
        : '「' + v + '」是休息日（周三/周五），已对齐到本周一：' + snapped + '\n\n当天本来就该休息，下一个训练日按正常节奏开跑。';
      alert(msg);
    }
    render(); return;
  }
  if(act==='showEnv'){
    const e = envInfo(), ea = envAdvice();
    openSheet(`<h3>环境自检</h3>
      <div class="tiny">这三项决定数据能不能留住</div>
      <div class="card tight" style="margin-top:12px">
        <div class="row"><div class="sp">打开方式</div><b>${e.isFile?'本地文件（file://）':'网址'}</b></div>
        <hr class="hr" style="margin:9px 0">
        <div class="row"><div class="sp">本机存储</div><b>${e.store?'可用':'不可用'+(e.storeWhy?'（'+esc(e.storeWhy)+'）':'')}</b></div>
        <hr class="hr" style="margin:9px 0">
        <div class="row"><div class="sp">是否已安装</div><b>${e.standalone?'已装到桌面':'浏览器标签页'}</b></div>
      </div>
      <div class="advice ${ea.cls}" style="margin-top:12px">${esc(ea.t)}</div>
      <div class="tiny" style="margin-top:10px">打开位置：${esc(e.host)}</div>
      <div class="row" style="margin-top:14px"><div class="sp"></div>
        <button class="btn sm primary" data-act="closesheet">知道了</button></div>`);
    return;
  }
  if(act==='geo'){
    if(!navigator.geolocation){ alert('这个浏览器不支持定位，直接输入城市名就行'); return; }
    btn.disabled = true; btn.textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(function(p){
      S.city = {name:'当前位置', lat:+p.coords.latitude.toFixed(3), lon:+p.coords.longitude.toFixed(3)};
      cache = {weather:null, at:0, dayKey:null}; save(); render(); maybeWeather();
    }, function(err){
      btn.disabled = false; btn.textContent = '用当前位置';
      alert('定位失败：'+((err && err.message) || '被拒绝')+'\n\n可以直接输入城市名，或用 https 网址打开后重试。');
    }, {timeout:8000, maximumAge:600000});
    return;
  }
  if(act==='dismissOnboard'){ S.seen = Object.assign({}, S.seen, {onboard:1}); save(); render(); return; }
  if(act==='dismissPTip'){ S.seen = Object.assign({}, S.seen, {pTip:1, onboard:1}); save(); render(); return; }
  if(act==='day'){ showDay(btn.dataset.date); return; }
  if(act==='str'){ showStrength(btn.dataset.m); return; }
  if(act==='test'){ showTest(btn.dataset.t); return; }
  if(act==='closesheet'){ closeSheet(); return; }
  if(act==='dataMode'){ S.dataMode = btn.dataset.m; save(); render(); return; }
  if(act==='importRuns'){ document.getElementById('fileRuns').click(); return; }
  if(act==='exportRuns'){
    const blob = new Blob([exportRunsMd()], {type:'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '跑步数据-'+todayISO()+'.md';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return;
  }
  if(act==='clearRuns'){
    if(confirm('清空手机里已导入的跑步数据？电脑端文件夹里的报告不受影响。')){ S.runs = []; save(); render(); }
    return;
  }
  if(act==='runDetail'){ showRun(btn.dataset.id); return; }


  if(act==='gate'){
    // S.daily 一律用【真实日期】：verdict()/gateCard() 就是这么读的。
    // 用 t（课表日期）写进去，平移过课表后读的地方就永远读不到 —— 这个坑是外部审查抓到的。
    const dt = todayISO();
    const hrv = parseFloat(document.getElementById('inHrv').value);
    const rhr = parseFloat(document.getElementById('inRhr').value);
    S.daily[dt] = Object.assign({}, S.daily[dt], {hrv:isNaN(hrv)?null:hrv, rhr:isNaN(rhr)?null:rhr});
    save(); render(); return;
  }
  if(act==='pain'){
    const dt = todayISO();
    S.daily[dt] = Object.assign({}, S.daily[dt], {pain: !(S.daily[dt]&&S.daily[dt].pain)});
    save(); render(); return;
  }
  if(act==='wx'){
    /* 网络可能卡住 8 秒再重试一次，这段时间要给反馈，否则像死机 */
    btn.disabled = true; btn.textContent = '取天气…';
    const hint = setTimeout(function(){
      try{ if(btn.isConnected !== false) btn.textContent = '还在重试…'; }catch(e){}
    }, 4000);
    await loadWeather(true);
    clearTimeout(hint);
    render(); return;
  }
  if(act==='ck'){
    const d = dayByDate(t) || dayByDate(DAYS[0].date);
    const status = btn.dataset.s;
    if(status==='cancel'){ delete S.checks[d.date]; save(); render(); return; }
    S.checks[d.date] = Object.assign({note:'',feel:null}, S.checks[d.date]||{}, {status});
    save(); render(); return;
  }
  if(act==='strCheck'){
    const d = dayByDate(t);
    if(!d) return;
    const v = btn.dataset.v === '1';
    S.checks[d.date] = Object.assign({}, S.checks[d.date] || {}, {strength: v});
    save(); render(); return;
  }
  if(act==='feel'){
    const d = dayByDate(t);
    S.checks[d.date] = Object.assign({note:'',status:'done'}, S.checks[d.date]||{}, {feel:parseInt(btn.dataset.f,10)});
    save(); render(); return;
  }
  if(act==='saveNote'){
    const d = dayByDate(t);
    const note = document.getElementById('inNote').value.trim();
    S.checks[d.date] = Object.assign({status:'done',feel:null}, S.checks[d.date]||{}, {note});
    save(); render(); return;
  }
  if(act==='toggleWx'){ S.weather = !S.weather; save(); render(); if(S.weather) maybeWeather(); return; }
  if(act==='sex'){
    S.profile = Object.assign({}, S.profile, {sex: btn.dataset.v});
    save(); render(); return;
  }
  if(act==='saveProfile'){
    const g = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
    const p = Object.assign({}, S.profile, {
      age: g('pAge'), height: g('pHeight'), weight: g('pWeight'),
      rhr: g('pRhr'), hrmax: g('pHrmax')
    });
    const hrv = g('pHrv');
    if(hrv && hrv > 20) S.hrvBase = Math.round(hrv);
    if(p.rhr && p.rhr > 30) S.rhrBase = Math.round(p.rhr);
    if(p.hrmax == null || p.hrmax < 120) p.hrmax = estHrMax(p.age);
    S.profile = p;
    save();
    // 已有的跑记录按新参数重算负荷
    (S.runs||[]).forEach(r => { r.trimp = calcTrimp(r.hrHist, p); });
    render(); return;
  }
  if(act==='saveBase'){
    const a = parseInt(document.getElementById('inHrvBase').value,10);
    const b = parseInt(document.getElementById('inRhrBase').value,10);
    if(!isNaN(a) && a>20) S.hrvBase = a;
    if(!isNaN(b) && b>30) S.rhrBase = b;
    S.city = S.city; save(); render(); return;
  }
  if(act==='findCity'){
    const q = (document.getElementById('inCity').value||'').trim();
    if(!q) return;
    btn.disabled = true; btn.textContent = '查找…';
    try{
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name='+encodeURIComponent(q));
      const j = await r.json();
      const it = (j.results||[])[0];
      if(it){ S.city = {name:it.name, lat:it.latitude, lon:it.longitude}; cache = {weather:null,at:0,dayKey:null}; save(); render(); maybeWeather(); }
      else { alert('没找到「'+q+'」，换个写法试试（如 杭州 / Hangzhou）'); btn.disabled=false; btn.textContent='查找'; }
    }catch(err){ alert('查找失败，检查网络'); btn.disabled=false; btn.textContent='查找'; }
    return;
  }
  if(act==='export'){
    const blob = new Blob([JSON.stringify({
      plan: PLAN.meta.id, profile: WHO, profileTitle: PLAN.meta.title,
      exported: new Date().toISOString(), state: S
    }, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '跑步打卡备份-' + (WHO||'未知') + '-' + todayISO() + '.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    return;
  }
  if(act==='import'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const j = JSON.parse(rd.result);
          if(j && j.state){
            if(j.profile && j.profile !== WHO && !confirm('这份备份属于「'+(j.profileTitle||j.profile)+'」，\n当前档案是「'+(PLAN.meta.title||WHO)+'」。\n\n导入会覆盖当前档案的记录，继续？')) return;
            S = normalizeState(j.state);
            save(); render(); alert('已导入 '+Object.keys(S.checks||{}).length+' 条打卡');
          }
          else alert('文件里没有 state 字段');
        }catch(err){ alert('文件解析失败'); }
      };
      rd.readAsText(f);
    };
    inp.click();
    return;
  }
  if(act==='reset'){
    if(confirm('清空所有打卡与 HRV 记录？导出的备份不受影响。')){
      S.checks = {}; S.daily = {}; save(); render();
    }
    return;
  }
});

async function maybeWeather(){
  if(!S.weather || !S.city || S.city.lat==null) return;
  await loadWeather(false);
  /* 成功失败都要重画：失败时要把「取不到的原因」显示出来，
     否则卡片会一直停在「还没取过」，用户看不出是真失败还是在等。 */
  if(S.tab==='today') render();
}

const __tab = Q.get('tab');

document.addEventListener('change', async (e)=>{
  if(e.target && e.target.id==='fileRuns'){
    const files = [...e.target.files];
    if(!files.length) return;
    let ok = 0; const errs = [];
    for(const f of files){
      try{
        const run = await parseRunFile(f);
        const dup = S.runs.some(x => x.date===run.date && Math.abs(x.dist-run.dist)<0.05);
        if(dup){ errs.push(f.name+'：重复'); continue; }
        S.runs.push(run); ok++;
      }catch(err){ errs.push(f.name+'：'+err.message); }
    }
    S.runs.sort((a,b)=> a.date<b.date?-1:1);
    save(); render();
    alert('导入成功 '+ok+' 条'+(errs.length?('\n\n未导入：\n'+errs.join('\n')):''));
    e.target.value = '';
  }
});

function showRun(id){
  const r = (S.runs||[]).find(x=>x.id===id);
  if(!r) return;
  const tot = Object.values(r.zs||{}).reduce((a,b)=>a+b,0)||1;
  const lines = ['warm','E','M','T','GP','I','over'].filter(z=>r.zs&&r.zs[z]).map(z=>
    '<li>'+ZLABEL[z]+'：'+Math.round(r.zs[z]/60)+' 分（'+Math.round(r.zs[z]/tot*100)+'%）</li>').join('');
  openSheet('<h3>'+esc(r.title)+'</h3><div class="tiny">'+r.date+' '+r.time+' ｜ '+(r.week?('W'+r.week):'计划外')+'</div>'+
    '<div class="hero" style="--zc:'+(ZC[r.planned]||'#64748b')+';margin-top:12px">'+
    '<div class="stats">'+statBox('距离', r.dist.toFixed(2)+' km')+statBox('时长', Math.round(r.dur/60)+' 分')+
    statBox('均心率', r.avgHr||'—')+statBox('配速', r.pace?mmssJS(r.pace)+' /km':'—')+'</div></div>'+
    '<b>区间分布</b><ul class="tips">'+(lines||'<li>无心率数据</li>')+'</ul>'+
    '<div class="row" style="margin-top:14px"><div class="sp tiny">步频 '+(r.cad||'—')+' · 最大心率 '+(r.maxHr||'—')+' · 负荷 '+(r.trimp==null?'—':r.trimp+' TRIMP')+'</div>'+
    '<button class="btn sm primary" data-act="closesheet">关闭</button></div>');
}

/* ---------- 启动 ---------- */
migrateLegacy();
(function boot(){
  const qp = Q.get('plan');
  const who = (qp && PLANS[qp]) ? qp : Store.read(LS_WHO);
  if(who && PLANS[who]){
    setWho(who);
    if(['today','plan','data','log','set'].includes(__tab)) S.tab = __tab;
    render();
    maybeWeather();
    /* 城市：首次打开按系统时区自动定，省掉「每次都要重新输入」 */
    if(!S.city || S.city.lat==null){
      autoCity().then(function(ch){ if(ch){ render(); maybeWeather(); } });
    }
  }else{
    render();   // 还没选档案 → 显示选择屏
  }
})();
/* 装到桌面：只有 http(s) 托管时才注册 Service Worker，本地文件直接跳过 */
if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator && /^https?:$/.test(String(location.protocol||''))){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
